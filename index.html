<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Чат</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; margin: 0; padding: 20px; }
        .chat-box { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; height: 85vh; }
        #messages { flex: 1; overflow-y: auto; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: #2a2a2a; padding: 8px 12px; border-radius: 8px; word-wrap: break-word; }
        .msg-header { font-size: 12px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .msg-user { color: #4c57af; font-weight: bold; }
        .controls { display: flex; gap: 8px; }
        input { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; outline: none; }
        #userInput { width: 100px; }
        #textInput { flex: 1; }
        button { background: #4c57af; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #457aa0; }
    </style>
</head>
<body>

<div class="chat-box">
    <div id="messages">Загрузка сообщений...</div>
    <div class="controls">
        <input type="text" id="userInput" placeholder="Имя" maxlength="15">
        <input type="text" id="textInput" placeholder="Сообщение..." maxlength="200">
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, push, query, limitToLast, onValue } from "https://gstatic.com";

    const firebaseConfig = {
        databaseURL: "https://chatks-15b32-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = query(ref(db, 'messages'), limitToLast(30));

    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');

    // Получаем сообщения в реальном времени
    onValue(messagesRef, (snapshot) => {
        messagesDiv.innerHTML = '';
        const data = snapshot.val();
        
        if (!data) {
            messagesDiv.innerHTML = '<div style="color:#777; text-align:center;">Сообщений пока нет</div>';
            return;
        }

        Object.values(data).forEach(msg => {
            const div = document.createElement('div');
            div.className = 'msg';
            
            const header = document.createElement('div');
            header.className = 'msg-header';
            
            const userSpan = document.createElement('span');
            userSpan.className = 'msg-user';
            userSpan.textContent = msg.user;
            
            const timeSpan = document.createElement('span');
            timeSpan.textContent = msg.time;
            
            header.appendChild(userSpan);
            header.appendChild(timeSpan);
            
            const textDiv = document.createElement('div');
            textDiv.textContent = msg.text;
            
            div.appendChild(header);
            div.appendChild(textDiv);
            messagesDiv.appendChild(div);
        });
        
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }, (error) => {
        messagesDiv.innerHTML = '<div style="color:#ff5555; text-align:center;">Ошибка подключения к базе: ' + error.message + '</div>';
    });

    // Отправка сообщения
    function sendMessage() {
        const user = (userInput.value.trim() || 'Anon').slice(0, 15);
        const text = textInput.value.trim().slice(0, 200);
        
        if (!text) return;

        const now = new Date();
        const time = now.toTimeString().slice(0, 5);

        push(ref(db, 'messages'), {
            user: user,
            text: text,
            time: time
        });

        textInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
